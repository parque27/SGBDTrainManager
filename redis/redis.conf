# Configuración de Redis para OCEMT. Cada opción explica por qué está.

# --- Red ---------------------------------------------------------------------
# Dentro del contenedor escucha en todas las interfaces para que lo vean los demás
# servicios (Redis Insight, backend). Desde fuera solo se llega por 127.0.0.1,
# porque el compose publica el puerto únicamente ahí.
bind 0.0.0.0
port 6379
# Sin contraseña todavía: protected-mode rechazaría a los otros contenedores.
# Pendiente: usuarios ACL (ver docs/tecnicas.md).
protected-mode no

# --- Memoria -----------------------------------------------------------------
# Límite para que Redis nunca se coma la RAM del ordenador.
maxmemory 256mb
# Si se llena, solo expulsa claves que tienen TTL (estado en vivo y cachés),
# las menos usadas primero. Las series temporales, índices y metadatos no tienen
# TTL, así que nunca se pierden por falta de memoria.
maxmemory-policy volatile-lru
# Histogramas de tamaño de clave por tipo (Redis 8.6+), útiles para analizar memoria.
key-memory-histograms yes

# --- Persistencia ------------------------------------------------------------
# Todo lo de Redis se puede reconstruir desde PostgreSQL, pero con AOF no hay que
# esperar a que el replay vuelva a llenarlo tras un reinicio. everysec: como mucho
# se pierde 1 segundo de escrituras.
appendonly yes
appendfsync everysec

# --- Diagnóstico (para la demo y para medir) ---------------------------------
# Guarda en SLOWLOG los comandos que tarden más de 1 ms.
slowlog-log-slower-than 1000
slowlog-max-len 256
# Registra eventos de latencia de más de 5 ms (LATENCY LATEST / LATENCY DOCTOR).
latency-monitor-threshold 5

# --- Notificaciones ----------------------------------------------------------
# E = eventos de keyevent, x = expiraciones. Permite enterarse cuando caduca
# train:<id>, es decir, cuando un tren deja de emitir posición.
notify-keyspace-events Ex
